name: Hello World

on:
  schedule:
    - cron: '43 * * * *'  # 每小時第 43 分執行（避開整點尖峰）
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: 執行程式
        run: python helloWorld.py
